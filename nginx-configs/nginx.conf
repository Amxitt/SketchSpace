server{
    listen 80;
    server_name sketchspace.13.206.68.125.nip.io;

    location / {
        proxy_pass http://localhost:5000;
    }
}

server {
    listen 80;
    server_name api-sketchspace.13.206.68.125.nip.io;

    location / {
        proxy_pass http://localhost:4000;
    }
}

server {
    listen 80;
    server_name ws-sketchspace.13.206.68.125.nip.io;

    location / {
        proxy_pass http://localhost:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}